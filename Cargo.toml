[package]
name = "nucleo-l432kc-app"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"

embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread", "task-arena-size-16384"] }
embassy-time = { version = "0.4", features = ["defmt", "defmt-timestamp-uptime"] }

embassy-stm32 = { version = "0.2", features = [
    "defmt",
    "stm32l432kc",
    "time-driver-any",
    "memory-x",
    "exti",
] }

# These MUST sit under [dependencies], NOT under [profile.release]
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

[profile.release]
debug = 2
opt-level = "s"
lto = true
